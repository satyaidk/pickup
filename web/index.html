<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pickup: commit messages from your diff</title>
  <meta name="description" content="Paste your git diff and pick from three well-written commit messages, written by AI.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    // Apply a saved theme choice before the page paints. With none saved, CSS follows the system theme.
    try {
      var theme = localStorage.getItem("pickup-theme");
      if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400..700;1,400&family=Martian+Mono:wdth,wght@75..112.5,300..700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
